# Supabase CLI configuration for local development.
#
# Used by `supabase start` (local Docker stack) and `supabase db reset`, which
# applies everything in supabase/migrations/ in order. `project_id` is the local
# stack identifier; the remote project is linked separately with
# `supabase link --project-ref <ref>`.
project_id = "tabletopchaos"

[db]
# Postgres major version for the local stack. Matches the remote project (17).
major_version = 17

[auth]
# Local dev site URL — where Supabase Auth sends confirmation/reset redirects.
# Override per environment; production uses the deployed origin.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Email/password is the starting method (1.2). OAuth can be enabled later.
enable_signup = true

# --- Edge Functions (Phase 1.5 billing) ---
# The DM-facing functions require a valid Supabase JWT (default verify_jwt=true);
# they authorize the owner from that token. The Stripe webhook CANNOT present a
# Supabase JWT, so verify_jwt is disabled for it — its authenticity comes from
# the Stripe signature check inside the function instead.
[functions.create-checkout-session]
verify_jwt = true

[functions.create-billing-portal-session]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false
